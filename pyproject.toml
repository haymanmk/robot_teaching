[project]
name = "robot-teaching"
version = "0.1.0"
description = "Teach-by-demonstration interface for the reBot Arm B601-RS: drag the arm, record points, play back with trajectory planning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.23.4",
    "pyyaml>=6.0",
    "pin>=3.9.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# motorbridge is the CAN/serial motor bridge used by the upstream actuator layer;
# only needed to drive the real arm (Linux wheels).
hardware = ["motorbridge>=0.4.9"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
robot-teaching = "robot_teaching.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_teaching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
